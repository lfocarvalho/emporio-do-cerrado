<ion-content [fullscreen]="true" class="ion-padding">
  <form (ngSubmit)="autenticarUsuario()">
    <ion-list>
      <ion-item>
        <ion-input
          label="Usuário"
          labelPlacement="floating"
          placeholder="Digite seu usuário"
          type="text"
          name="username"
          autocomplete="username"
          autocapitalize="off"
          autocorrect="off"
          required
          [(ngModel)]="instancia.username">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Senha"
          labelPlacement="floating"
          placeholder="Digite sua senha"
          type="password"
          name="password"
          autocomplete="current-password"
          required
          [(ngModel)]="instancia.password">
        </ion-input>
      </ion-item>
    </ion-list>
    <ion-button type="submit" expand="block" class="ion-text-center">
      AUTENTICAR
    </ion-button>
  </form>
</ion-content>
