<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Favoritos</ion-title>
  </ion-toolbar>
  </ion-header>

<ion-content [fullscreen]="true">
  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="6" sizeMd="4" sizeLg="3" *ngFor="let p of produtos">
        <ion-card (click)="abrirProduto(p)">
          <ion-img *ngIf="p.imagem" [src]="p.imagem" alt="{{p.nome}}"></ion-img>
          <ion-card-header>
            <ion-card-title>{{ p.nome }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <div class="preco">R$ {{ p.preco | number:'1.2-2' }}</div>
            <div class="acoes">
              <ion-button fill="clear" size="small" color="danger" (click)="$event.stopPropagation(); removerFavorito(p)">
                <ion-icon slot="start" name="heart"></ion-icon>
                Remover
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="vazio" *ngIf="!produtos?.length">
    <p>Nenhum favorito ainda.</p>
  </div>
</ion-content>
