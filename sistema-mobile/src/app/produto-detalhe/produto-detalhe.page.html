<ion-header>
  <ion-toolbar color="success">
    <ion-title class="ion-text-center">Detalhe do Produto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngIf="produto">
    <img *ngIf="produto.imagem" [src]="produto.imagem" style="width:100%; border-radius: 12px 12px 0 0;" />
    <ion-card-header>
      <ion-card-title>{{ produto.nome }}</ion-card-title>
      <ion-card-subtitle>R$ {{ produto.preco }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>{{ produto.descricao }}</p>
      <ion-button expand="block" (click)="adicionarAoCarrinho()">Adicionar ao carrinho</ion-button>
    </ion-card-content>
  </ion-card>

  <div *ngIf="!produto" class="empty-state">
    <p>Carregando...</p>
  </div>
</ion-content>
