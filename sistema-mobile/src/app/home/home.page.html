<ion-page>
  <ion-header>
    <ion-toolbar color="dark">
      <ion-title class="ion-text-center">Empório do Cerrado</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding" fullscreen>
    <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
      <ion-refresher-content pullingText="Puxe para atualizar" refreshingSpinner="circles" refreshingText="Atualizando..."></ion-refresher-content>
    </ion-refresher>
  <div class="main-container">
    <!-- Carrossel (modo seguro/minimal) -->
    <div class="carrossel-container">
  <swiper-container slides-per-view="1" pagination="true" autoplay="true" loop="true" style="height: 200px; display:block;">
        <swiper-slide *ngFor="let slide of slidesCarrossel">
          <img [src]="slide.imagem" alt="slide" style="width:100%;height:100%;object-fit:cover" />
        </swiper-slide>
        <swiper-slide *ngIf="!slidesCarrossel?.length">
          <div class="empty-slide" style="display:flex;align-items:center;justify-content:center;height:100%">
            <p>Adicione um slide com imagem no painel "Gerir Carrossel"</p>
          </div>
        </swiper-slide>
      </swiper-container>
    </div>

    <!-- Categorias -->
    <div class="section-container" *ngIf="categorias.length">
      <h2 class="section-title">Categorias</h2>
      <div class="categories-grid">
        <ion-card *ngFor="let categoria of categorias" class="category-card" (click)="abrirCategoria(categoria)">
          <ion-card-content class="category-content">
            <div class="category-icon-container">
              <ion-icon name="bag-outline" class="category-icon"></ion-icon>
            </div>
            <p class="category-name">{{ categoria.nome }}</p>
          </ion-card-content>
        </ion-card>
      </div>
    </div>

    <!-- Novidades -->
    <div class="section-container" *ngIf="produtos.length">
      <h2 class="section-title">Novidades</h2>
      <div class="products-grid">
        <ion-card *ngFor="let produto of produtos" class="product-card">
          <div class="product-image-container">
            <img [src]="produto.imagem" *ngIf="produto.imagem" class="product-image" />
            <div class="product-actions">
              <ion-button fill="clear" class="action-button" (click)="adicionarAoCarrinho(produto)">
                <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
              </ion-button>
              <ion-button fill="clear" class="action-button" (click)="toggleFavorito(produto)">
                <ion-icon [name]="produto.favorito ? 'heart' : 'heart-outline'" slot="icon-only"></ion-icon>
              </ion-button>
            </div>
          </div>
          <ion-card-header>
            <ion-card-title>{{ produto.nome }}</ion-card-title>
            <ion-card-subtitle>R$ {{ produto.preco }}</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </div>
    </div>
    </div>
  </ion-content>
</ion-page>
