<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <div class="brand">
        <img class="brand-logo" [src]="logoUrl" alt="Empório do Cerrado" />
        <span>Empório do Cerrado</span>
      </div>
    </ion-title>
  </ion-toolbar>
  
</ion-header>

<ion-content [fullscreen]="true">
    <!-- Carrossel de destaque (scroll horizontal leve) -->
    <div class="section">
      <div class="carousel-track" aria-label="Carrossel de destaques">
        <img *ngFor="let img of carrosselImagens" [src]="img" alt="Destaque" loading="lazy" />
      </div>
    </div>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Início</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Categorias -->
  <div class="section">
    <div class="section-header">
      <h2 class="section-title">Categorias</h2>
      <ion-button fill="clear" size="small" color="primary" (click)="verTodasCategorias()">Ver todas</ion-button>
    </div>
    <div class="categories-track" *ngIf="!loadingCategorias && categoriasDestaque.length > 0">
      <button class="category-chip" *ngFor="let categoria of categoriasDestaque" (click)="navigateToCategoria(categoria.nome)">
        <div class="chip-circle">
          <ion-icon name="bag-outline" color="success" aria-hidden="true"></ion-icon>
        </div>
        <span class="chip-label">{{ categoria.nome }}</span>
      </button>
    </div>

    <div *ngIf="loadingCategorias" class="loading-container">
      <ion-spinner></ion-spinner>
    </div>
    
    <ion-text color="medium" *ngIf="!loadingCategorias && categoriasDestaque.length === 0">
      <p class="ion-text-center">Nenhuma categoria disponível</p>
    </ion-text>
  </div>

  <!-- Produtos Recentes -->
  <div class="section">
    <h2 class="section-title">Produtos Recentes</h2>
    <div *ngIf="!loadingProdutos && produtos.length > 0">
      <ion-card *ngFor="let produto of produtos" button (click)="navigateToProduto(produto.id)">
        <ion-grid>
          <ion-row>
            <ion-col size="4">
              <img [src]="produto.foto || produto.imagem || 'assets/icon/favicon.png'" [alt]="produto.nome" />
            </ion-col>
            <ion-col size="8">
              <ion-card-header>
                <ion-card-title>{{ produto.nome }}</ion-card-title>
                <ion-card-subtitle>{{ produto.preco | currency:'BRL' }}</ion-card-subtitle>
              </ion-card-header>
              <ion-card-content>
                <p class="produto-descricao">{{ produto.descricao }}</p>
              </ion-card-content>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card>
    </div>

    <div *ngIf="loadingProdutos" class="loading-container">
      <ion-spinner></ion-spinner>
    </div>

    <ion-text color="medium" *ngIf="!loadingProdutos && produtos.length === 0">
      <p class="ion-text-center">Nenhum produto disponível</p>
    </ion-text>
  </div>
</ion-content>
