<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produtos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produtos</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="search-container">
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="onSearch()"
      placeholder="Buscar produtos..."
      animated
    ></ion-searchbar>
  </div>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="!loading && produtos.length > 0">
    <ion-card *ngFor="let produto of produtos" button (click)="navigateToProduto(produto.id)">
      <ion-grid>
        <ion-row>
          <ion-col size="4">
            <img [src]="produto.foto || produto.imagem || 'assets/icon/favicon.png'" [alt]="produto.nome" />
          </ion-col>
          <ion-col size="8">
            <ion-card-header>
              <ion-card-title>{{ produto.nome }}</ion-card-title>
              <ion-card-subtitle>{{ produto.preco | currency:'BRL' }}</ion-card-subtitle>
            </ion-card-header>
            <ion-card-content>
              <p class="produto-descricao">{{ produto.descricao }}</p>
            </ion-card-content>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>
  </div>

  <div *ngIf="loading" class="loading-container">
    <ion-spinner></ion-spinner>
  </div>

  <ion-text color="medium" *ngIf="!loading && produtos.length === 0">
    <p class="ion-text-center ion-padding">Nenhum produto encontrado</p>
  </ion-text>
</ion-content>
